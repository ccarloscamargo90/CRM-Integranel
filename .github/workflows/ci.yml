name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: crm_granos_mx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/crm_granos_mx_test
      INEGI_DENUE_TOKEN: dummy_for_ci
      JWT_SECRET_KEY: ci-jwt-secret-not-for-production
      SECRET_KEY: ci-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Habilitar pg_trgm en DB de tests
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d crm_granos_mx_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Aplicar migraciones
        run: python -m alembic upgrade head

      - name: Ruff linter
        run: ruff check src tests

      - name: Pytest
        run: pytest -v --cov=src --cov-report=term-missing

      - name: Verificar que el schema y migraciones están en sync
        run: |
          # `alembic check` falla si hay diferencias entre target_metadata y la DB.
          # Como target_metadata=None (raw SQL migrations), este paso es informativo.
          python -m alembic current
          python -m alembic history | head -20
