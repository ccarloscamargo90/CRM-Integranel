# =====================================================================
# Fuentes complementarias — socios de cámaras + grandes productores
# =====================================================================
# Datos públicos curados manualmente (Fase 5.4 / 5.5).
#
# Origen: presentaciones públicas, comunicados de prensa, listados DOF,
# anuarios CONAFAB, conferencias industria avícola/porcícola/balanceado.
#
# Etiquetas que aplica el cruce a `establecimientos.etiquetas[]`:
# - CONAFAB             socio del Consejo Nacional Fabricantes Alimento Balanceado
# - PECUARIO_GRANDE     productor pecuario top (Bachoco, Pilgrim's, Norson, etc.)
# - HARINERO_INDUSTRIAL socios CANAMI o equivalente (Maseca/Gruma, Minsa, Harimasa)
#
# Cruce: por razón social UPPER+TRIM exacta (similar a SAT 69-B). El cliente
# `cruzar_fuentes_complementarias.py` actualiza `establecimientos.etiquetas[]`.
#
# IMPORTANTE: Esta lista es seed inicial parcial. Requiere actualización
# manual cuando las cámaras publiquen nuevos directorios.
# =====================================================================

empresas:
  # ---------- CONAFAB (socios fabricantes alimento balanceado) ----------
  # Top del sector. Listas oficiales en https://conafab.org/socios (cuando responde).
  - razon_social: BACHOCO SA DE CV
