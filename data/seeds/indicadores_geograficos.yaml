# =====================================================================
# Indicadores geográficos seed — datos públicos oficiales curados
# =====================================================================
# Fuentes:
# - Censo 2020 INEGI (población y demografía por entidad)
# - ENIGH 2022 INEGI (consumo per cápita de tortilla)
# - SIAP/SADER 2024 (producción de maíz por estado)
# - CONEVAL 2022 (% de pobreza por entidad, proxy de capacidad de compra)
#
# Reglas de uso:
# - Estos valores son SEED. Refrescar manualmente cuando INEGI publique
#   nuevos datos (ENIGH se publica cada 2 años, SIAP anual).
# - Si necesitas datos fresh vía API, el cliente `inegi_indicadores.py`
#   acepta un token INEGI distinto al del DENUE (registro separado).
# - Las cifras tienen 1-3 dígitos significativos para no aparentar
#   precisión que no tenemos.
# =====================================================================

indicadores:
  # ===== CONSUMO TORTILLA per cápita anual (kg) =====
  # Fuente: ENIGH 2022 INEGI, presentaciones públicas SIAP.
  # Promedio nacional ~73 kg/persona/año. Varía 50-95 kg por entidad.
