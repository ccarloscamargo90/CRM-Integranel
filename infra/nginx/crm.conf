# CRM Granos MX — crm.intergranel.com

# Redirección HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name crm.intergranel.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS reverse proxy hacia FastAPI
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.intergranel.com;

    ssl_certificate     /etc/letsencrypt/live/crm.intergranel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.intergranel.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    location / {
        proxy_pass http://crm-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
