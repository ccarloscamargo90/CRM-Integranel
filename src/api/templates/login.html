{% extends "base.html" %}
{% block title %}Iniciar sesión · CRM Granos MX{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white shadow rounded-lg p-8">
  <div class="text-center mb-6">
    <h1 class="text-2xl font-bold text-primary-600">CRM Granos MX</h1>
    <p class="text-sm text-gray-500 mt-1">Sistema de inteligencia comercial Intergranel</p>
  </div>
  {% if error %}
  <div class="mb-4 px-3 py-2 rounded bg-red-100 text-red-800 text-sm">{{ error }}</div>
  {% endif %}
  <form action="/login" method="post" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="username">Usuario</label>
      <input id="username" name="username" required autofocus
             class="w-full px-3 py-2 border border-gray-300 rounded focus:border-primary-500 focus:ring-1 focus:ring-primary-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Contraseña</label>
      <input id="password" name="password" type="password" required
             class="w-full px-3 py-2 border border-gray-300 rounded focus:border-primary-500 focus:ring-1 focus:ring-primary-500">
    </div>
    <button type="submit"
            class="w-full bg-primary-600 hover:bg-primary-700 text-white py-2 rounded font-medium transition">
      Entrar
    </button>
  </form>
  <p class="text-xs text-gray-400 mt-6 text-center">
    Datos personales tratados conforme a LFPDPPP 2025.
  </p>
</div>
{% endblock %}
